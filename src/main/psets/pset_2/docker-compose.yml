name: ciencia-de-datos-ssd-failure-pipeline-pset-2

services:
  kestra-postgres:
    image: postgres:17-alpine
    environment:
      #?  Esta estructura de mensajes permite que si no se encuentra la variable de entorno, se muestre un
      #? mensaje de error indicando que debe ser configurada en el archivo .env. Este archivo se lee desde otro
      #? directorio proveido durante la ejecucion del compose
      POSTGRES_DB: ${KESTRA_POSTGRES_DB:?set KESTRA_POSTGRES_DB in .env}
      POSTGRES_USER: ${KESTRA_POSTGRES_USER:?set KESTRA_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${KESTRA_POSTGRES_PASSWORD:?set KESTRA_POSTGRES_PASSWORD in .env}
    ports:
      - "${KESTRA_POSTGRES_HOST_PORT}:5432"
    volumes:
      - kestra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - data-platform

  kestra:
    image: kestra/kestra:v1.3.40
    user: root
    command: ["server", "standalone", "--config", "/etc/kestra/application.yml"]
    environment:
      #? Determinan la URL para la string de conexion JDBC para la base de management de Kestra
      ENV_KESTRA_DATABASE_HOST: kestra-postgres
      ENV_KESTRA_DATABASE_PORT: "5432"
      ENV_KESTRA_DATABASE: ${KESTRA_POSTGRES_DB:?set KESTRA_POSTGRES_DB in .env}
      #? Determinan el usuario y contrasena del usuario base de Kestra
      ENV_KESTRA_USERNAME: ${KESTRA_POSTGRES_USER:?set KESTRA_POSTGRES_USER in .env}
      ENV_KESTRA_PASSWORD: ${KESTRA_POSTGRES_PASSWORD:?set KESTRA_POSTGRES_PASSWORD in .env}
      ENV_KESTRA_BASIC_AUTH_USERNAME: ${KESTRA_BASIC_AUTH_USERNAME:?set KESTRA_BASIC_AUTH_USERNAME in .env}
      ENV_KESTRA_BASIC_AUTH_PASSWORD: ${KESTRA_BASIC_AUTH_PASSWORD:?set KESTRA_BASIC_AUTH_PASSWORD in .env}
      # Kestra OSS resolves secret('NAME') from a base64-encoded SECRET_NAME.
      SECRET_SNOWFLAKE_ACCOUNT: ${SECRET_SNOWFLAKE_ACCOUNT:?set base64-encoded SECRET_SNOWFLAKE_ACCOUNT in .env}
      SECRET_SNOWFLAKE_USER: ${SECRET_SNOWFLAKE_USER:?set base64-encoded SECRET_SNOWFLAKE_USER in .env}
      SECRET_SNOWFLAKE_PASSWORD: ${SECRET_SNOWFLAKE_PASSWORD:?set base64-encoded SECRET_SNOWFLAKE_PASSWORD in .env}
      SECRET_SNOWFLAKE_ROLE: ${SECRET_SNOWFLAKE_ROLE:?set base64-encoded SECRET_SNOWFLAKE_ROLE in .env}
      SECRET_SNOWFLAKE_WAREHOUSE: ${SECRET_SNOWFLAKE_WAREHOUSE:?set base64-encoded SECRET_SNOWFLAKE_WAREHOUSE in .env}
    ports:
      - "${KESTRA_PORT}:8080"
      - "${KESTRA_MANAGEMENT_PORT}:8081"
    volumes:
      - ./src/res/config/kestra/application.yml:/etc/kestra/application.yml:ro
      - ./src/main/kestra/flows:/workspace/kestra/flows
      - ./src/res/data/raw:/usr/data/landing:ro
      - kestra_internal_storage:/app/storage
      - ./src/res/logs/kestra:/tmp/kestra-wd
      #? Anademos el socket de docker para finalmente poder ejecutar contenedores de Docker internamente
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      kestra-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - data-platform

  dbt-ui-backend:
    build:
      context: ./src/res/docker/custom-images
      dockerfile: Dockerfile.semana05.backend
      args:
        DBT_UI_COMMIT: ${DBT_UI_COMMIT:-1fe89c5d023cd4d7a88642091c303a75839534f9}
        DBT_CORE_VERSION: "1.12.5"
        DBT_DUCKDB_VERSION: "1.11.0"
        DBT_SNOWFLAKE_VERSION: "1.12.1"
    environment:
      DBT_UI_HOST: 0.0.0.0
      DBT_UI_PORT: "8001"
      DBT_UI_PROJECTS_PATH: /workspace/dbt-projects
      DBT_UI_DATA_DIR: /var/lib/dbt-ui
      DBT_PROFILES_DIR: /home/dbtui/.dbt
      DBT_LOG_PATH: /var/log/dbt
      DBT_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:? set SNOWFLAKE_ACCOUNT in .env}
      DBT_SNOWFLAKE_USER: ${SNOWFLAKE_USER:? set SNOWFLAKE_USER in .env}
      DBT_SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:? set SNOWFLAKE_PASSWORD in .env}
      DBT_SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      DBT_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:? set SNOWFLAKE_WAREHOUSE in .env}
      DBT_SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:? set SNOWFLAKE_DATABASE in .env}
      DBT_SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:? set SNOWFLAKE_SCHEMA in .env}
      DBT_SNOWFLAKE_THREADS: ${DBT_SNOWFLAKE_THREADS:-4}
    volumes:
      - ./src/main/dbt:/workspace/dbt-projects
      - ./src/res/config/dbt/profiles:/home/dbtui/.dbt
      - dbt_ui_data:/var/lib/dbt-ui
      - ./src/res/logs/dbt:/var/log/dbt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - data-platform

  dbt-ui:
    build:
      context: ./src/res/docker/custom-images
      dockerfile: Dockerfile.semana05.frontend
      args:
        DBT_UI_COMMIT: ${DBT_UI_COMMIT:-1fe89c5d023cd4d7a88642091c303a75839534f9}
    ports:
      - "${DBT_UI_PORT}:8080"
    depends_on:
      dbt-ui-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - data-platform

  spark:
    build:
      context: ./src/res
      dockerfile: docker/custom-images/Dockerfile.pset2.spark
    environment:
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-2g}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?set JUPYTER_TOKEN in .env}
      JUPYTER_CONFIG_DIR: /tmp/jupyter/config
      JUPYTER_DATA_DIR: /tmp/jupyter/data
      JUPYTER_RUNTIME_DIR: /tmp/jupyter/runtime
      SF_TEMPORARY_CREDENTIAL_CACHE_DIR: /tmp/snowflake-credential-cache
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:? set SNOWFLAKE_ACCOUNT in .env}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:? set SNOWFLAKE_USER in .env}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:? set SNOWFLAKE_PASSWORD in .env}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:? set SNOWFLAKE_WAREHOUSE in .env}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:? set SNOWFLAKE_DATABASE in .env}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:? set SNOWFLAKE_SCHEMA in .env}
      SPARK_HOME: /opt/spark
      PYSPARK_PYTHON: /usr/bin/python3
      PYTHONPATH: /opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip:/opt/spark/lib
    ports:
      - "127.0.0.1:${SPARK_UI_PORT:-4040}:4040"
      - "127.0.0.1:${JUPYTER_PORT:-4041}:8888"
    volumes:
      - ./src/main/python/spark/jobs:/opt/spark/jobs:ro
      - ./src/main/python/spark/lib:/opt/spark/lib:ro
      - ./src/main/python/spark/notebooks:/opt/spark/notebooks
      - ./src/res/config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src/res/config/spark/spark-env.sh:/opt/spark/conf/spark-env.sh:ro
      - ./src/res/config/spark/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./src/res/logs/spark:/opt/spark/logs
    working_dir: /opt/spark/notebooks
    command:
      - bash
      - -lc
      - >-
        exec /usr/bin/python3 -m jupyterlab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --ServerApp.root_dir=/opt/spark/notebooks
        --ServerApp.allow_remote_access=True
        --IdentityProvider.token="$${JUPYTER_TOKEN}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://127.0.0.1:8888/api/status?token='$${JUPYTER_TOKEN} >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    networks:
      - data-platform

  snowpark-connect:
    build:
      context: ./src/res/docker/custom-images
      dockerfile: Dockerfile.pset2.snowpark
      args:
        SPARK_VERSION: ${SNOWPARK_SPARK_VERSION:-3.5.6}
        HADOOP_PROFILE: ${SNOWPARK_HADOOP_PROFILE:-hadoop3}
        SNOWPARK_CONNECT_VERSION: ${SNOWPARK_CONNECT_VERSION:-1.44.0}
    environment:
      SF_TEMPORARY_CREDENTIAL_CACHE_DIR: /tmp/snowflake-credential-cache
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:? set SNOWFLAKE_ACCOUNT in .env}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:? set SNOWFLAKE_USER in .env}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:? set SNOWFLAKE_PASSWORD in .env}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE_HIGH_COMPUTE:? set SNOWFLAKE_WAREHOUSE_HIGH_COMPUTE in .env}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:? set SNOWFLAKE_DATABASE in .env}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:? set SNOWFLAKE_SCHEMA in .env}
      SNOWFLAKE_GOLD_SCHEMA: ${SNOWFLAKE_GOLD_SCHEMA:-S_CDATOS_PSET2_GOLD}
      SNOWFLAKE_OBT_SCHEMA: ${SNOWFLAKE_OBT_SCHEMA:-S_CDATOS_PSET2_OBT}
      SNOWPARK_CONNECT_VERBOSE: ${SNOWPARK_CONNECT_VERBOSE:-false}
      PYTHONPATH: /opt/spark/lib
    volumes:
      - ./src/main/python/spark/jobs:/opt/spark/jobs:ro
      - ./src/main/python/spark/lib:/opt/spark/lib:ro
      - ./src/res/logs/spark:/opt/spark/logs
    working_dir: /opt/spark/work
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import pyspark; from snowflake import snowpark_connect
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - data-platform

volumes:
  kestra_postgres_data:
  kestra_internal_storage:
  dbt_ui_data:

networks:
  data-platform:
    name: ciencia-de-datos-data-platform-pset-2
    driver: bridge
