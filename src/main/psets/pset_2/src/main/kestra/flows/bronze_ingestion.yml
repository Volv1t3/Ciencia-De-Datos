#? ==========================================================================================
#? FLOW DE INGESTA BRONZE (Fuente -> Kestra -> Bronze)
#? ------------------------------------------------------------------------------------------
#? Que hace, en orden:
#?   1. Crea (si no existen) el FILE FORMAT, el STAGE y las 3 tablas RAW en Snowflake.
#?   2. plan_partitions: un script Python mira el ZIP de la fuente y arma "paquetes" de dias
#?      (2 meses por paquete) -> partitions.json.
#?   3. partition_workers: hasta 6 paquetes en paralelo; dentro de cada paquete se procesa
#?      dia por dia: extraer CSV del ZIP -> PUT al stage -> borrar el CSV temporal.
#?   4. merge_csv: un unico MERGE desde el stage hacia la tabla RAW (idempotente).
#?   5. verify_load + fail_if_incomplete: reconciliacion. Si alguna fila del stage no quedo
#?      en Bronze, la ejecucion termina en FAILED.
#?
#? Por que es "Bronze": se guarda el dato ORIGINAL (todo como texto dentro de un VARIANT) +
#? metadatos de linaje (archivo, fila, fecha, hash). No se limpia ni se tipa nada aqui;
#? eso lo hace dbt en Silver.
#? ==========================================================================================

#? id + namespace identifican el flow en Kestra (UI: Flows > ssd_failure_prediction > bronze_ingestion).
id: bronze_ingestion
namespace: ssd_failure_prediction
description: Stage validated Tianchi CSV rows and merge source-faithful VARIANT records into Bronze.
#? Solo UNA ejecucion del flow a la vez. Evita que dos cargas hagan MERGE sobre la misma tabla
#? al mismo tiempo (condiciones de carrera / bloqueos en Snowflake). Las demas quedan en cola.
concurrency:
  limit: 1
#? ------------------------------------------------------------------------------------------
#? INPUTS: parametros que se eligen al pulsar "Execute" en la UI (o desde un trigger/API).
#? ------------------------------------------------------------------------------------------
inputs:
  #? Que dataset cargar. Uno por ejecucion para que una carga historica no sea gigantesca.
  #? Por defecto failure_labels porque es el mas pequeno (sirve como prueba rapida).
  - id: dataset
    type: SELECT
    values: [smart_2018, smart_2019, failure_labels]
    defaults: failure_labels
    description: One source dataset per execution so historical loads stay bounded.
  #? requested_start_date / requested_end_date = mecanismo de BACKFILL.
  #? Son opcionales: vacios = todos los dias del ZIP. Con valores (inclusive, YYYY-MM-DD)
  #? se recarga solo ese rango. Solo aplican a SMART (las etiquetas no tienen fecha por archivo).
  - id: requested_start_date
    type: STRING
    required: false
    description: Inclusive YYYY-MM-DD filter for dated SMART CSV files.
  - id: requested_end_date
    type: STRING
    required: false
    description: Inclusive YYYY-MM-DD filter for dated SMART CSV files.

tasks:
  #? ========================================================================================
  #? BLOQUE 1: DDL idempotente (CREATE ... IF NOT EXISTS). Se puede correr mil veces sin romper.
  #? ----------------------------------------------------------------------------------------
  #? Patron repetido en TODAS las tareas Snowflake de este flow:
  #?   - type ...snowflake.Query  -> plugin JDBC de Kestra que ejecuta SQL en Snowflake.
  #?   - retry exponential        -> MANEJO DE ERRORES: si falla (red, timeout, warehouse
  #?                                 suspendido) reintenta esperando 10s, 20s, 40s... (tope 1 min
  #?                                 entre intentos), maximo 4 intentos o 10 min en total.
  #?   - warningOnRetry: true     -> si tuvo que reintentar, la ejecucion queda en WARNING
  #?                                 (no SUCCESS) para que se note que hubo un problema.
  #?   - secret('...')            -> credenciales leidas de variables SECRET_* (base64) del .env;
  #?                                 nunca estan escritas en el repo.
  #?   - queryTag                 -> etiqueta cada query con el id de ejecucion; en Snowflake
  #?                                 (QUERY_HISTORY) se puede rastrear que queries hizo cada corrida.
  #?   - connectionPooling: false -> conexion nueva por tarea (mas simple, sin conexiones colgadas).
  #? ========================================================================================

  #? FILE FORMAT = como Snowflake debe leer los CSV que subimos al stage:
  #? separado por comas, salta la cabecera, comillas opcionales, campo vacio -> NULL,
  #? UTF8 y COMPRESSION AUTO (detecta el .gz que genera el PUT).
  - id: create_csv_file_format
    type: io.kestra.plugin.jdbc.snowflake.Query
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT1M
      maxAttempts: 4
      maxDuration: PT10M
      warningOnRetry: true
    url: "jdbc:snowflake://{{ secret('SNOWFLAKE_ACCOUNT') }}.snowflakecomputing.com"
    username: "{{ secret('SNOWFLAKE_USER') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    role: "{{ secret('SNOWFLAKE_ROLE') }}"
    warehouse: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
    database: S_CDATOS_PSET2
    schema: S_CDATOS_PSET2_BRONZE
    queryTag: "kestra-bronze-ingestion-{{ execution.id }}"
    connectionPooling: false
    sql: |
      CREATE FILE FORMAT IF NOT EXISTS S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_CSV_FORMAT
        TYPE = CSV FIELD_DELIMITER = ',' SKIP_HEADER = 1
        FIELD_OPTIONALLY_ENCLOSED_BY = '"' EMPTY_FIELD_AS_NULL = TRUE
        ENCODING = 'UTF8' COMPRESSION = AUTO

  #? STAGE interno = "carpeta" dentro de Snowflake donde se suben archivos con PUT antes de
  #? leerlos con SQL. Se le asocia el file format anterior.
  - id: create_smart_archive_stage
    type: io.kestra.plugin.jdbc.snowflake.Query
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT1M
      maxAttempts: 4
      maxDuration: PT10M
      warningOnRetry: true
    url: "jdbc:snowflake://{{ secret('SNOWFLAKE_ACCOUNT') }}.snowflakecomputing.com"
    username: "{{ secret('SNOWFLAKE_USER') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    role: "{{ secret('SNOWFLAKE_ROLE') }}"
    warehouse: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
    database: S_CDATOS_PSET2
    schema: S_CDATOS_PSET2_BRONZE
    queryTag: "kestra-bronze-ingestion-{{ execution.id }}"
    connectionPooling: false
    sql: |
      CREATE STAGE IF NOT EXISTS S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_ARCHIVE_STAGE
        FILE_FORMAT = S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_CSV_FORMAT

  #? Por si el stage ya existia (p. ej. creado por el bootstrap SQL con otro formato), se fuerza
  #? que use SMART_CSV_FORMAT. CREATE IF NOT EXISTS no modifica un objeto existente; ALTER si.
  - id: configure_smart_archive_stage
    type: io.kestra.plugin.jdbc.snowflake.Query
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT1M
      maxAttempts: 4
      maxDuration: PT10M
      warningOnRetry: true
    url: "jdbc:snowflake://{{ secret('SNOWFLAKE_ACCOUNT') }}.snowflakecomputing.com"
    username: "{{ secret('SNOWFLAKE_USER') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    role: "{{ secret('SNOWFLAKE_ROLE') }}"
    warehouse: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
    database: S_CDATOS_PSET2
    schema: S_CDATOS_PSET2_BRONZE
    queryTag: "kestra-bronze-ingestion-{{ execution.id }}"
    connectionPooling: false
    sql: |
      ALTER STAGE S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_ARCHIVE_STAGE
        SET FILE_FORMAT = S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_CSV_FORMAT

  #? Tabla Bronze. Esquema GENERICO (igual para los 3 datasets):
  #?   SOURCE_ARCHIVE  nombre del ZIP de origen            \
  #?   SOURCE_FILE     CSV dentro del ZIP                   } <- juntos = clave natural de la fila
  #?   SOURCE_ROW      numero de linea dentro del CSV      /     (se usa en el MERGE)
  #?   SOURCE_DATE     fecha del archivo diario (NULL en etiquetas)
  #?   SOURCE_SHA256   hash del contenido -> detecta si una fila cambio al recargar
  #?   RAW_RECORD      VARIANT (JSON) con TODAS las columnas originales como texto
  #?   INGESTED_AT     cuando se cargo/actualizo
  #? Por que VARIANT y texto: Bronze debe conservar el dato tal cual; si se tipara aqui y un
  #? valor no convirtiera, se perderia informacion. El tipado se hace en Silver con TRY_TO_*.
  - id: create_smart_2018_table
    type: io.kestra.plugin.jdbc.snowflake.Query
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT1M
      maxAttempts: 4
      maxDuration: PT10M
      warningOnRetry: true
    url: "jdbc:snowflake://{{ secret('SNOWFLAKE_ACCOUNT') }}.snowflakecomputing.com"
    username: "{{ secret('SNOWFLAKE_USER') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    role: "{{ secret('SNOWFLAKE_ROLE') }}"
    warehouse: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
    database: S_CDATOS_PSET2
    schema: S_CDATOS_PSET2_BRONZE
    queryTag: "kestra-bronze-ingestion-{{ execution.id }}"
    connectionPooling: false
    sql: |
      CREATE TABLE IF NOT EXISTS S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_2018_RAW (
        SOURCE_ARCHIVE VARCHAR, SOURCE_FILE VARCHAR, SOURCE_ROW NUMBER,
        SOURCE_DATE DATE, SOURCE_SHA256 VARCHAR, RAW_RECORD VARIANT,
        INGESTED_AT TIMESTAMP_LTZ DEFAULT CURRENT_TIMESTAMP()
      )

  #? 2019 y etiquetas copian la estructura de 2018 con CREATE TABLE ... LIKE (mismo esquema).
  - id: create_smart_2019_table
    type: io.kestra.plugin.jdbc.snowflake.Query
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT1M
      maxAttempts: 4
      maxDuration: PT10M
      warningOnRetry: true
    url: "jdbc:snowflake://{{ secret('SNOWFLAKE_ACCOUNT') }}.snowflakecomputing.com"
    username: "{{ secret('SNOWFLAKE_USER') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    role: "{{ secret('SNOWFLAKE_ROLE') }}"
    warehouse: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
    database: S_CDATOS_PSET2
    schema: S_CDATOS_PSET2_BRONZE
    queryTag: "kestra-bronze-ingestion-{{ execution.id }}"
    connectionPooling: false
    sql: |
      CREATE TABLE IF NOT EXISTS S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_2019_RAW
        LIKE S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_2018_RAW

  - id: create_failure_label_table
    type: io.kestra.plugin.jdbc.snowflake.Query
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT1M
      maxAttempts: 4
      maxDuration: PT10M
      warningOnRetry: true
    url: "jdbc:snowflake://{{ secret('SNOWFLAKE_ACCOUNT') }}.snowflakecomputing.com"
    username: "{{ secret('SNOWFLAKE_USER') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    role: "{{ secret('SNOWFLAKE_ROLE') }}"
    warehouse: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
    database: S_CDATOS_PSET2
    schema: S_CDATOS_PSET2_BRONZE
    queryTag: "kestra-bronze-ingestion-{{ execution.id }}"
    connectionPooling: false
    sql: |
      CREATE TABLE IF NOT EXISTS S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SSD_FAILURE_LABEL_RAW
        LIKE S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_2018_RAW

  #? ========================================================================================
  #? BLOQUE 2: PLANIFICACION. Decide QUE archivos cargar y COMO repartirlos.
  #? ----------------------------------------------------------------------------------------
  #? Ejecuta prepare_bronze.py en modo "plan". Lee el ZIP montado en /usr/data/landing
  #? (solo lectura, ver docker-compose), filtra por las fechas de backfill y agrupa los dias en
  #? paquetes de 2 meses. Resultado: partitions.json, p. ej.
  #?   [{"id":"2018-01_to_2018-02","dates":["2018-01-01",...]}, {...}]
  #? Process = corre el comando dentro del propio contenedor de Kestra (no levanta otro Docker).
  #? Los inputs se pasan como variables de entorno; default('') convierte "sin valor" en vacio.
  #? No tiene retry a proposito: si falla es por un error DETERMINISTA (ZIP faltante, fechas mal
  #? escritas, esquema distinto) y reintentar daria el mismo error.
  #? ========================================================================================
  - id: plan_partitions
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      START_DATE: "{{ inputs.requested_start_date | default('') }}"
      END_DATE: "{{ inputs.requested_end_date | default('') }}"
      DATASET: "{{ inputs.dataset }}"
    commands:
      - python3 /workspace/kestra/flows/prepare_bronze.py plan partitions.json
    #? outputFiles: Kestra guarda partitions.json en su storage interno para que la siguiente
    #? tarea lo lea con read(outputs.plan_partitions.outputFiles[...]).
    outputFiles: [partitions.json]

  #? ========================================================================================
  #? BLOQUE 3: EXTRACCION + SUBIDA, en paralelo por paquete y secuencial por dia.
  #? ----------------------------------------------------------------------------------------
  #? ForEach externo: un "worker" por cada paquete de 2 meses; hasta 6 a la vez
  #? (6 x 2 meses = 1 ano completo en paralelo).
  #? fromJson(read(...)) = leer partitions.json y convertirlo en lista.
  #? ========================================================================================
  - id: partition_workers
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ fromJson(read(outputs.plan_partitions.outputFiles['partitions.json'])) }}"
    concurrencyLimit: 6
    tasks:
      #? ForEach interno: recorre los dias del paquete UNO POR UNO (concurrencyLimit: 1).
      #? taskrun.value del ForEach externo es el paquete (JSON) -> .dates es su lista de dias.
      #? Secuencial para que en disco solo exista UN CSV diario por worker a la vez: un ano
      #? completo descomprimido pesa ~38 GiB y no cabe/no conviene materializarlo.
      - id: worker_days
        type: io.kestra.plugin.core.flow.ForEach
        values: "{{ fromJson(taskrun.value).dates }}"
        concurrencyLimit: 1
        tasks:
          #? 3a. Extraer un dia: valida el CSV dentro del ZIP y lo reescribe agregando las
          #? columnas de linaje (archivo, fila, fecha). Aqui taskrun.value ya es el dia
          #? (ej. 2018-01-05) o la palabra failure_labels.
          #? La ruta incluye execution.id para que dos ejecuciones nunca pisen sus archivos.
          - id: prepare_day
            type: io.kestra.plugin.scripts.shell.Commands
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            env:
              DATASET: "{{ inputs.dataset }}"
            commands:
              - mkdir -p "/tmp/kestra-wd/bronze/{{ execution.id }}/{{ inputs.dataset }}/{{ taskrun.value }}"
              - python3 /workspace/kestra/flows/prepare_bronze.py extract "{{ taskrun.value }}" "/tmp/kestra-wd/bronze/{{ execution.id }}/{{ inputs.dataset }}/{{ taskrun.value }}/bronze_rows.csv"

          #? 3b. PUT = subir el archivo local al stage interno de Snowflake.
          #? AUTO_COMPRESS lo sube como .csv.gz (menos red); OVERWRITE permite reintentar el
          #? mismo dia sin error de "archivo ya existe". Retry mas paciente que el DDL porque
          #? un upload grande puede fallar por red (hasta 30 min en total).
          #? Nota: el SQL debe EMPEZAR con PUT (el driver JDBC lo detecta asi); por eso no se
          #? ponen comentarios dentro del bloque sql.
          - id: upload_day
            type: io.kestra.plugin.jdbc.snowflake.Query
            retry:
              type: exponential
              interval: PT15S
              maxInterval: PT2M
              maxAttempts: 4
              maxDuration: PT30M
              warningOnRetry: true
            url: "jdbc:snowflake://{{ secret('SNOWFLAKE_ACCOUNT') }}.snowflakecomputing.com"
            username: "{{ secret('SNOWFLAKE_USER') }}"
            password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
            role: "{{ secret('SNOWFLAKE_ROLE') }}"
            warehouse: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
            database: S_CDATOS_PSET2
            schema: S_CDATOS_PSET2_BRONZE
            queryTag: "kestra-bronze-ingestion-{{ execution.id }}"
            connectionPooling: false
            sql: |
              PUT file:///tmp/kestra-wd/bronze/{{ execution.id }}/{{ inputs.dataset }}/{{ taskrun.value }}/bronze_rows.csv
                @S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_ARCHIVE_STAGE/kestra/{{ execution.id }}/{{ inputs.dataset }}/{{ taskrun.value }}/
                AUTO_COMPRESS = TRUE OVERWRITE = TRUE

          #? 3c. Borrar el CSV local ya subido -> el disco nunca acumula el ano completo.
          - id: cleanup_day
            type: io.kestra.plugin.scripts.shell.Commands
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - rm -f "/tmp/kestra-wd/bronze/{{ execution.id }}/{{ inputs.dataset }}/{{ taskrun.value }}/bronze_rows.csv"

  #? ========================================================================================
  #? BLOQUE 4: MERGE del stage a la tabla Bronze (un solo statement para toda la ejecucion).
  #? ----------------------------------------------------------------------------------------
  #? - Las 3 primeras lineas son Pebble (motor de plantillas de Kestra, sintaxis tipo Jinja):
  #?   eligen la tabla destino segun el input dataset.
  #? - FROM @stage/kestra/<execution.id>/<dataset>/ lee SOLO los archivos de ESTA ejecucion.
  #?   $1, $2, ... = columna 1, 2, ... del CSV del stage. $1..$4 son el linaje que agrego el
  #?   script; desde $5 vienen las columnas originales de la fuente.
  #? - OBJECT_CONSTRUCT_KEEP_NULL arma el VARIANT {"disk_id": "...", "ds": "...", ...}
  #?   conservando las claves aunque el valor sea NULL (asi se sabe que la columna existia).
  #?   NULLIF(x,'') convierte texto vacio en NULL.
  #? - SHA2(TO_JSON(raw_record)) = huella digital de la fila.
  #? - ON (archive, file, row) = clave natural. Esto hace la carga IDEMPOTENTE:
  #?     * fila nueva                    -> INSERT
  #?     * fila existente y mismo hash   -> no se toca (recargar no duplica)
  #?     * fila existente y hash distinto-> UPDATE (la fuente se corrigio)
  #?   Nunca hay DELETE: si un archivo nuevo omite una fila, Bronze conserva la historica.
  #? - Si hay que agregar/quitar una columna de la fuente: cambiar esta lista Y SMART_HEADERS en
  #?   prepare_bronze.py (el orden de $n debe coincidir con el orden del CSV).
  #? Retry: 3 intentos y hasta 2 h porque un ano completo es un MERGE de cientos de millones
  #? de filas.
  #? ========================================================================================
  - id: merge_csv
    type: io.kestra.plugin.jdbc.snowflake.Query
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 3
      maxDuration: PT2H
      warningOnRetry: true
    url: "jdbc:snowflake://{{ secret('SNOWFLAKE_ACCOUNT') }}.snowflakecomputing.com"
    username: "{{ secret('SNOWFLAKE_USER') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    role: "{{ secret('SNOWFLAKE_ROLE') }}"
    warehouse: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
    database: S_CDATOS_PSET2
    schema: S_CDATOS_PSET2_BRONZE
    queryTag: "kestra-bronze-ingestion-{{ execution.id }}"
    connectionPooling: false
    sql: |
      {% if inputs.dataset == 'smart_2018' %}{% set target_table = 'SMART_2018_RAW' %}
      {% elseif inputs.dataset == 'smart_2019' %}{% set target_table = 'SMART_2019_RAW' %}
      {% else %}{% set target_table = 'SSD_FAILURE_LABEL_RAW' %}{% endif %}
      MERGE INTO S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.{{ target_table }} AS target
      USING (
        SELECT source_archive, source_file, source_row, source_date,
               SHA2(TO_JSON(raw_record), 256) AS source_sha256, raw_record
        FROM (
          SELECT $1::VARCHAR AS source_archive, $2::VARCHAR AS source_file,
                 $3::NUMBER AS source_row, TRY_TO_DATE($4::VARCHAR) AS source_date,
          {% if inputs.dataset == 'failure_labels' %}
                 OBJECT_CONSTRUCT_KEEP_NULL(
                   'model', NULLIF($5::VARCHAR, ''),
                   'failure_time', NULLIF($6::VARCHAR, ''),
                   'disk_id', NULLIF($7::VARCHAR, '')
                 ) AS raw_record
          {% else %}
                 OBJECT_CONSTRUCT_KEEP_NULL(
                   'disk_id',NULLIF($5::VARCHAR,''),'ds',NULLIF($6::VARCHAR,''),'model',NULLIF($7::VARCHAR,''),
                   'n_1',NULLIF($8::VARCHAR,''),'r_1',NULLIF($9::VARCHAR,''),'n_2',NULLIF($10::VARCHAR,''),'r_2',NULLIF($11::VARCHAR,''),
                   'n_3',NULLIF($12::VARCHAR,''),'r_3',NULLIF($13::VARCHAR,''),'n_4',NULLIF($14::VARCHAR,''),'r_4',NULLIF($15::VARCHAR,''),
                   'n_5',NULLIF($16::VARCHAR,''),'r_5',NULLIF($17::VARCHAR,''),'n_6',NULLIF($18::VARCHAR,''),'r_6',NULLIF($19::VARCHAR,''),
                   'n_7',NULLIF($20::VARCHAR,''),'r_7',NULLIF($21::VARCHAR,''),'n_8',NULLIF($22::VARCHAR,''),'r_8',NULLIF($23::VARCHAR,''),
                   'n_9',NULLIF($24::VARCHAR,''),'r_9',NULLIF($25::VARCHAR,''),'n_10',NULLIF($26::VARCHAR,''),'r_10',NULLIF($27::VARCHAR,''),
                   'n_11',NULLIF($28::VARCHAR,''),'r_11',NULLIF($29::VARCHAR,''),'n_12',NULLIF($30::VARCHAR,''),'r_12',NULLIF($31::VARCHAR,''),
                   'n_13',NULLIF($32::VARCHAR,''),'r_13',NULLIF($33::VARCHAR,''),'n_170',NULLIF($34::VARCHAR,''),'r_170',NULLIF($35::VARCHAR,''),
                   'n_171',NULLIF($36::VARCHAR,''),'r_171',NULLIF($37::VARCHAR,''),'n_172',NULLIF($38::VARCHAR,''),'r_172',NULLIF($39::VARCHAR,''),
                   'n_173',NULLIF($40::VARCHAR,''),'r_173',NULLIF($41::VARCHAR,''),'n_174',NULLIF($42::VARCHAR,''),'r_174',NULLIF($43::VARCHAR,''),
                   'n_177',NULLIF($44::VARCHAR,''),'r_177',NULLIF($45::VARCHAR,''),'n_180',NULLIF($46::VARCHAR,''),'r_180',NULLIF($47::VARCHAR,''),
                   'n_181',NULLIF($48::VARCHAR,''),'r_181',NULLIF($49::VARCHAR,''),'n_182',NULLIF($50::VARCHAR,''),'r_182',NULLIF($51::VARCHAR,''),
                   'n_183',NULLIF($52::VARCHAR,''),'r_183',NULLIF($53::VARCHAR,''),'n_184',NULLIF($54::VARCHAR,''),'r_184',NULLIF($55::VARCHAR,''),
                   'n_187',NULLIF($56::VARCHAR,''),'r_187',NULLIF($57::VARCHAR,''),'n_188',NULLIF($58::VARCHAR,''),'r_188',NULLIF($59::VARCHAR,''),
                   'n_189',NULLIF($60::VARCHAR,''),'r_189',NULLIF($61::VARCHAR,''),'n_190',NULLIF($62::VARCHAR,''),'r_190',NULLIF($63::VARCHAR,''),
                   'n_191',NULLIF($64::VARCHAR,''),'r_191',NULLIF($65::VARCHAR,''),'n_192',NULLIF($66::VARCHAR,''),'r_192',NULLIF($67::VARCHAR,''),
                   'n_193',NULLIF($68::VARCHAR,''),'r_193',NULLIF($69::VARCHAR,''),'n_194',NULLIF($70::VARCHAR,''),'r_194',NULLIF($71::VARCHAR,''),
                   'n_195',NULLIF($72::VARCHAR,''),'r_195',NULLIF($73::VARCHAR,''),'n_196',NULLIF($74::VARCHAR,''),'r_196',NULLIF($75::VARCHAR,''),
                   'n_197',NULLIF($76::VARCHAR,''),'r_197',NULLIF($77::VARCHAR,''),'n_198',NULLIF($78::VARCHAR,''),'r_198',NULLIF($79::VARCHAR,''),
                   'n_199',NULLIF($80::VARCHAR,''),'r_199',NULLIF($81::VARCHAR,''),'n_200',NULLIF($82::VARCHAR,''),'r_200',NULLIF($83::VARCHAR,''),
                   'n_204',NULLIF($84::VARCHAR,''),'r_204',NULLIF($85::VARCHAR,''),'n_205',NULLIF($86::VARCHAR,''),'r_205',NULLIF($87::VARCHAR,''),
                   'n_206',NULLIF($88::VARCHAR,''),'r_206',NULLIF($89::VARCHAR,''),'n_207',NULLIF($90::VARCHAR,''),'r_207',NULLIF($91::VARCHAR,''),
                   'n_211',NULLIF($92::VARCHAR,''),'r_211',NULLIF($93::VARCHAR,''),'n_233',NULLIF($94::VARCHAR,''),'r_233',NULLIF($95::VARCHAR,''),
                   'n_240',NULLIF($96::VARCHAR,''),'r_240',NULLIF($97::VARCHAR,''),'n_241',NULLIF($98::VARCHAR,''),'r_241',NULLIF($99::VARCHAR,''),
                   'n_242',NULLIF($100::VARCHAR,''),'r_242',NULLIF($101::VARCHAR,''),'n_244',NULLIF($102::VARCHAR,''),'r_244',NULLIF($103::VARCHAR,''),
                   'n_245',NULLIF($104::VARCHAR,''),'r_245',NULLIF($105::VARCHAR,''),'n_175',NULLIF($106::VARCHAR,''),'r_175',NULLIF($107::VARCHAR,''),
                   'n_232',NULLIF($108::VARCHAR,''),'r_232',NULLIF($109::VARCHAR,'')
                 ) AS raw_record
          {% endif %}
          FROM @S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_ARCHIVE_STAGE/kestra/{{ execution.id }}/{{ inputs.dataset }}/
            (PATTERN => '.*bronze_rows[.]csv[.]gz')
        ) prepared
      ) AS source
      ON target.SOURCE_ARCHIVE = source.source_archive
       AND target.SOURCE_FILE = source.source_file
       AND target.SOURCE_ROW = source.source_row
      WHEN MATCHED AND target.SOURCE_SHA256 <> source.source_sha256 THEN UPDATE SET
        SOURCE_DATE=source.source_date, SOURCE_SHA256=source.source_sha256,
        RAW_RECORD=source.raw_record, INGESTED_AT=CURRENT_TIMESTAMP()
      WHEN NOT MATCHED THEN INSERT
        (SOURCE_ARCHIVE,SOURCE_FILE,SOURCE_ROW,SOURCE_DATE,SOURCE_SHA256,RAW_RECORD)
        VALUES (source.source_archive,source.source_file,source.source_row,
                source.source_date,source.source_sha256,source.raw_record);

  #? ========================================================================================
  #? BLOQUE 5: RECONCILIACION. "Lo que subi, ¿quedo en Bronze?"
  #? ----------------------------------------------------------------------------------------
  #? LEFT JOIN de cada fila del stage (de ESTA ejecucion) contra la tabla destino por la clave
  #? natural; las que no encuentran pareja (t.SOURCE_ROW IS NULL) son filas perdidas.
  #? fetchType FETCH_ONE -> devuelve una sola fila, accesible como outputs.verify_load.row.
  #? ========================================================================================
  - id: verify_load
    type: io.kestra.plugin.jdbc.snowflake.Query
    retry:
      type: exponential
      interval: PT15S
      maxInterval: PT2M
      maxAttempts: 4
      maxDuration: PT30M
      warningOnRetry: true
    url: "jdbc:snowflake://{{ secret('SNOWFLAKE_ACCOUNT') }}.snowflakecomputing.com"
    username: "{{ secret('SNOWFLAKE_USER') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    role: "{{ secret('SNOWFLAKE_ROLE') }}"
    warehouse: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
    database: S_CDATOS_PSET2
    schema: S_CDATOS_PSET2_BRONZE
    queryTag: "kestra-bronze-ingestion-{{ execution.id }}"
    connectionPooling: false
    fetchType: FETCH_ONE
    sql: |
      {% if inputs.dataset == 'smart_2018' %}{% set target_table = 'SMART_2018_RAW' %}
      {% elseif inputs.dataset == 'smart_2019' %}{% set target_table = 'SMART_2019_RAW' %}
      {% else %}{% set target_table = 'SSD_FAILURE_LABEL_RAW' %}{% endif %}
      SELECT COUNT(*) AS MISSING_ROWS
      FROM @S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_ARCHIVE_STAGE/kestra/{{ execution.id }}/{{ inputs.dataset }}/
        (PATTERN => '.*bronze_rows[.]csv[.]gz') s
      LEFT JOIN S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.{{ target_table }} t
        ON t.SOURCE_ARCHIVE=s.$1::VARCHAR AND t.SOURCE_FILE=s.$2::VARCHAR
       AND t.SOURCE_ROW=s.$3::NUMBER
      WHERE t.SOURCE_ROW IS NULL

  #? Si falto aunque sea una fila, se marca la ejecucion como FAILED explicitamente.
  #? Sin esto el flow terminaria en SUCCESS aunque la carga estuviera incompleta.
  - id: fail_if_incomplete
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ outputs.verify_load.row.MISSING_ROWS > 0 }}"
    errorMessage: Snowflake BRONZE is missing rows from this execution.

  #? ========================================================================================
  #? BLOQUE 6: LIMPIEZA DEL STAGE (solo si todo salio bien).
  #? ----------------------------------------------------------------------------------------
  #? Los .csv.gz de esta ejecucion ya estan en Bronze y reconciliados -> se borran del stage para
  #? que no se acumulen (costo de almacenamiento). Si la ejecucion fallo antes, esta tarea no
  #? corre y los archivos quedan en el stage para poder investigar.
  #? ========================================================================================
  - id: remove_execution_stage_files
    type: io.kestra.plugin.jdbc.snowflake.Query
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT1M
      maxAttempts: 4
      maxDuration: PT10M
      warningOnRetry: true
    url: "jdbc:snowflake://{{ secret('SNOWFLAKE_ACCOUNT') }}.snowflakecomputing.com"
    username: "{{ secret('SNOWFLAKE_USER') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    role: "{{ secret('SNOWFLAKE_ROLE') }}"
    warehouse: "{{ secret('SNOWFLAKE_WAREHOUSE') }}"
    database: S_CDATOS_PSET2
    schema: S_CDATOS_PSET2_BRONZE
    queryTag: "kestra-bronze-ingestion-{{ execution.id }}"
    connectionPooling: false
    sql: |
      REMOVE @S_CDATOS_PSET2.S_CDATOS_PSET2_BRONZE.SMART_ARCHIVE_STAGE/kestra/{{ execution.id }}/

#? ==========================================================================================
#? FINALLY: se ejecuta SIEMPRE al terminar (exito o fallo). Borra los CSV temporales locales de
#? esta ejecucion; si upload_day fallo, cleanup_day no llego a correr y quedarian en disco.
#? ==========================================================================================
finally:
  - id: cleanup_local_workdir
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - rm -rf "/tmp/kestra-wd/bronze/{{ execution.id }}"
