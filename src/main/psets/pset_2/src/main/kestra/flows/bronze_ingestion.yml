id: bronze_ingestion
namespace: ssd_failure_prediction
description: Load Tianchi CSV rows into Snowflake BRONZE as schema-independent raw JSON.
concurrency:
  limit: 1
inputs:
  - id: requested_start_date
    type: STRING
    required: false
    description: Inclusive YYYY-MM-DD filter for dated smartlog CSV files.
  - id: requested_end_date
    type: STRING
    required: false
    description: Inclusive YYYY-MM-DD filter for dated smartlog CSV files.
tasks:
  - id: prepare_rows
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      START_DATE: "{{ inputs.requested_start_date | default('') }}"
      END_DATE: "{{ inputs.requested_end_date | default('') }}"
      BATCH_ID: "{{ execution.id }}"
    commands:
      - python3 /workspace/kestra/flows/prepare_bronze.py bronze_rows.jsonl
    outputFiles:
      - bronze_rows.jsonl

  - id: ensure_bronze_tables
    type: io.kestra.plugin.jdbc.snowflake.Queries
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    database: "{{ envs.snowflake_database }}"
    schema: BRONZE
    warehouse: "{{ envs.snowflake_warehouse }}"
    sql: |
      CREATE TABLE IF NOT EXISTS BRONZE.SMART_RAW_STAGING (
        BATCH_ID VARCHAR, SOURCE_ARCHIVE VARCHAR, SOURCE_FILE VARCHAR,
        SOURCE_ROW NUMBER, SOURCE_DATE DATE, SOURCE_SHA256 VARCHAR,
        RAW_RECORD VARIANT, INGESTED_AT TIMESTAMP_LTZ DEFAULT CURRENT_TIMESTAMP()
      );
      CREATE TABLE IF NOT EXISTS BRONZE.SMART_RAW (
        SOURCE_ARCHIVE VARCHAR, SOURCE_FILE VARCHAR, SOURCE_ROW NUMBER,
        SOURCE_DATE DATE, SOURCE_SHA256 VARCHAR, RAW_RECORD VARIANT,
        INGESTED_AT TIMESTAMP_LTZ DEFAULT CURRENT_TIMESTAMP()
      );

  - id: upload_rows
    type: io.kestra.plugin.jdbc.snowflake.Upload
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    database: "{{ envs.snowflake_database }}"
    schema: BRONZE
    warehouse: "{{ envs.snowflake_warehouse }}"
    from: "{{ outputs.prepare_rows.outputFiles['bronze_rows.jsonl'] }}"
    stageName: "@{{ envs.snowflake_database }}.BRONZE.SMART_ARCHIVE_STAGE"
    prefix: "kestra/{{ execution.id }}"
    fileName: bronze_rows.jsonl
    compress: true

  - id: copy_rows
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    database: "{{ envs.snowflake_database }}"
    schema: BRONZE
    warehouse: "{{ envs.snowflake_warehouse }}"
    sql: |
      COPY INTO BRONZE.SMART_RAW_STAGING
        (BATCH_ID, SOURCE_ARCHIVE, SOURCE_FILE, SOURCE_ROW,
         SOURCE_DATE, SOURCE_SHA256, RAW_RECORD)
      FROM (
        SELECT $1:batch::VARCHAR, $1:archive::VARCHAR, $1:file::VARCHAR,
               $1:row::NUMBER, TRY_TO_DATE($1:date::VARCHAR),
               $1:sha256::VARCHAR, $1:values
        FROM @{{ envs.snowflake_database }}.BRONZE.SMART_ARCHIVE_STAGE/kestra/{{ execution.id }}/
      )
      FILE_FORMAT = (TYPE = JSON COMPRESSION = AUTO)
      PATTERN = '.*bronze_rows[.]jsonl[.]gz'
      ON_ERROR = ABORT_STATEMENT;

  - id: merge_rows
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    database: "{{ envs.snowflake_database }}"
    schema: BRONZE
    warehouse: "{{ envs.snowflake_warehouse }}"
    sql: |
      MERGE INTO BRONZE.SMART_RAW AS target
      USING (
        SELECT SOURCE_ARCHIVE, SOURCE_FILE, SOURCE_ROW, SOURCE_DATE,
               SOURCE_SHA256, RAW_RECORD
        FROM BRONZE.SMART_RAW_STAGING
        WHERE BATCH_ID = '{{ execution.id }}'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY SOURCE_ARCHIVE, SOURCE_FILE, SOURCE_ROW
          ORDER BY INGESTED_AT DESC
        ) = 1
      ) AS source
      ON target.SOURCE_ARCHIVE = source.SOURCE_ARCHIVE
       AND target.SOURCE_FILE = source.SOURCE_FILE
       AND target.SOURCE_ROW = source.SOURCE_ROW
      WHEN MATCHED AND target.SOURCE_SHA256 <> source.SOURCE_SHA256 THEN UPDATE SET
        SOURCE_DATE = source.SOURCE_DATE,
        SOURCE_SHA256 = source.SOURCE_SHA256,
        RAW_RECORD = source.RAW_RECORD,
        INGESTED_AT = CURRENT_TIMESTAMP()
      WHEN NOT MATCHED THEN INSERT
        (SOURCE_ARCHIVE, SOURCE_FILE, SOURCE_ROW, SOURCE_DATE, SOURCE_SHA256, RAW_RECORD)
        VALUES (source.SOURCE_ARCHIVE, source.SOURCE_FILE, source.SOURCE_ROW,
                source.SOURCE_DATE, source.SOURCE_SHA256, source.RAW_RECORD);

  - id: verify_load
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    database: "{{ envs.snowflake_database }}"
    schema: BRONZE
    warehouse: "{{ envs.snowflake_warehouse }}"
    sql: |
      SELECT COUNT(*) AS MISSING_ROWS
      FROM BRONZE.SMART_RAW_STAGING s
      LEFT JOIN BRONZE.SMART_RAW t
        ON t.SOURCE_ARCHIVE = s.SOURCE_ARCHIVE
       AND t.SOURCE_FILE = s.SOURCE_FILE
       AND t.SOURCE_ROW = s.SOURCE_ROW
       AND t.SOURCE_SHA256 = s.SOURCE_SHA256
      WHERE s.BATCH_ID = '{{ execution.id }}' AND t.SOURCE_ROW IS NULL
    fetchType: FETCH_ONE

  - id: fail_if_incomplete
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ outputs.verify_load.row.MISSING_ROWS > 0 }}"
    errorMessage: Snowflake BRONZE is missing rows from this execution.
