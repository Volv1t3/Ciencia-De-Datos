#? Configuracion por defecto de Spark en el contenedor "spark" (Jupyter/EDA).
#? local[*] = sin cluster; un solo proceso que usa todos los cores del contenedor.
spark.master                              local[*]
spark.ui.port                             4040
#? Adaptive Query Execution: Spark reajusta joins/particiones en tiempo de ejecucion.
spark.sql.adaptive.enabled                true
#? UTC para que fechas/timestamps no cambien segun la zona horaria de la maquina.
spark.sql.session.timeZone                UTC
spark.ui.showConsoleProgress              false
#? 8 particiones de shuffle (el default 200 es excesivo en modo local).
spark.sql.shuffle.partitions              8
#? Guarda el historial de cada aplicacion en src/res/logs/spark.
spark.eventLog.enabled                    true
spark.eventLog.dir                        file:/opt/spark/logs
